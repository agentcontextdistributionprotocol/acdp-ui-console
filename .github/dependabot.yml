version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Batch routine minor/patch bumps into one PR; majors get their own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major-updates:
        update-types: [major]
    ignore:
      # typescript-eslint hard-throws on TS >=7 (no stable compiler API until
      # TS 7.1); typescript-eslint#10940 tracks it. 6.1+ also exceeds its
      # `<6.1.0` peer, so the guard sits below 7, not at it.
      # Remove once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        versions: ['>=6.1']
      # Types must track the runtime, not the newest publish: this repo pins
      # Node 24 everywhere (.nvmrc, ci.yml, Dockerfile). @types/node>=25 would
      # ship declarations for a Node major this repo doesn't run yet, and
      # auto-merge.yml would otherwise silently merge it on a green typecheck.
      # Remove once the runtime itself moves off Node 24.
      - dependency-name: "@types/node"
        versions: ['>=25']
      # acdp-wasm is the verification core and is on 0.x, where a MINOR is a
      # semantics change (bump-consume.yml@v1 counts it as breaking and holds
      # the dispatch-driven PR for a human). Without this, the monthly sweep
      # put the same bump in `minor-and-patch`, which auto-merge.yml@v1 arms on
      # a green check alone. Patches still flow; minors arrive via
      # bump-acdp.yml and wait. Issue #108; decision DECISIONS.md 2026-09-25.
      - dependency-name: "@agentcontextdistributionprotocol/acdp-wasm"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
