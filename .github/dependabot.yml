version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Batch routine minor/patch bumps into one PR; majors get their own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major-updates:
        update-types: [major]
    ignore:
      # typescript-eslint hard-throws on TS >=7 (no stable compiler API until
      # TS 7.1); typescript-eslint#10940 tracks it. 6.1+ also exceeds its
      # `<6.1.0` peer, so the guard sits below 7, not at it.
      # Remove once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        versions: ['>=6.1']
      # Types must track the runtime, not the newest publish: this repo pins
      # Node 22 everywhere (.nvmrc, ci.yml, Dockerfile). @types/node>=23 ships
      # declarations for node:ffi/node:quic, which crash on node:22-alpine.
      # auto-merge.yml would otherwise silently revert this on a green
      # typecheck (22 vs 26 output is byte-identical today). See #60.
      # Remove once the runtime itself moves off Node 22.
      - dependency-name: "@types/node"
        versions: ['>=23']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
